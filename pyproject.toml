# Repository tooling. The distributions are packages/client (mt5-connector-client) and
# packages/server (mt5-connector-server).

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["scripts"]
src = [".", "packages/client", "packages/server"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "scripts/"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -ra"
asyncio_mode = "auto"
