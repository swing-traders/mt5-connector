name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  lint-and-test:
    name: lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      # environment.yml installs packages/client editable; environment.dev.yml packages/server.
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml

      - name: Layer the dev tooling and the server
        run: micromamba env update -n mt5-connector -f environment.dev.yml --yes

      - name: Lint (black --check + ruff)
        run: just lint

      - name: Test (pytest)
        run: just test

  image:
    uses: ./.github/workflows/image.yml
    with:
      push: false
