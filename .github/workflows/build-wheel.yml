# Builds the client's and the server's wheels and, on a version tag, publishes both as one GitHub
# release.
name: build-wheel

on:
  push:
    tags: ["v0.*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheels
        run: |
          python -m pip install --quiet uv==0.11.33
          uv build --wheel packages/client --out-dir dist
          uv build --wheel packages/server --out-dir dist
          ls -la dist/

      - name: Verify wheel tags and checksums
        run: |
          for distribution in mt5_connector_client mt5_connector_server; do
            wheels=(dist/"${distribution}"-*.whl)
            if [[ "${#wheels[@]}" -ne 1 || ! -f "${wheels[0]}" ]]; then
              echo "::error::expected one ${distribution} wheel, found: ${wheels[*]}"; exit 1
            fi
            wheel="${wheels[0]}"
            case "$wheel" in
              dist/"${distribution}"-*-py3-none-any.whl) echo "wheel tag ok: $wheel" ;;
              *) echo "::error::wheel $wheel is not py3-none-any"; exit 1 ;;
            esac
            (cd dist && sha256sum "$(basename "$wheel")" > "$(basename "$wheel").sha256")
          done
          cat dist/*.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: |
            dist/mt5_connector_client-*
            dist/mt5_connector_server-*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheels
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mt5_connector_client-*
            dist/mt5_connector_server-*
          fail_on_unmatched_files: true

  # A release published with the default GITHUB_TOKEN does not fire other workflows'
  # `release` triggers, so the index is published from here instead.
  publish-index:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish-index.yml
