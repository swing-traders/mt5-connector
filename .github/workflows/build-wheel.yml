# Builds the wheel and, on a version tag, publishes it as a GitHub release.
name: build-wheel

on:
  push:
    tags: ["v0.*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          python -m pip install --quiet uv==0.11.33
          uv build --wheel
          ls -la dist/

      - name: Verify wheel tag and checksum
        run: |
          wheel=$(ls dist/mt5_connector-*.whl)
          case "$wheel" in
            dist/mt5_connector-*-py3-none-any.whl) echo "wheel tag ok: $wheel" ;;
            *) echo "::error::wheel $wheel is not py3-none-any"; exit 1 ;;
          esac
          (cd dist && sha256sum "$(basename "$wheel")" > "$(basename "$wheel").sha256" && cat *.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/mt5_connector-*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/mt5_connector-*
          fail_on_unmatched_files: true

  # A release published with the default GITHUB_TOKEN does not fire other workflows'
  # `release` triggers, so the index is published from here instead.
  publish-index:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish-index.yml
