[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mt5-connector-server"
dynamic = ["version"]
description = "The MT5 server: the MetaTrader5 package mirrored over HTTP, its push hub, and the terminal's EA"
readme = "mt5connector/server/README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "mt5-connector contributors" },
]
keywords = [
    "metatrader5",
    "mt5",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
# MetaTrader5 is Windows-only and imported by the HTTP server alone; numpy is held at 2.2.1 because
# later releases crash under Wine.
dependencies = [
    "MetaTrader5==5.0.6231; sys_platform == 'win32'",
    "numpy==2.2.1",
    "flask==3.1.3",
    "waitress==3.0.2",
    "websockets==17.0.1",
    "tzdata==2026.4",
]

[project.scripts]
mt5-connector-server = "mt5connector.server.app:main"
mt5-connector-hub = "mt5connector.server.ws_server:main"

[project.urls]
Homepage   = "https://github.com/swing-traders/mt5-connector"
Repository = "https://github.com/swing-traders/mt5-connector"
Issues     = "https://github.com/swing-traders/mt5-connector/issues"

# Both distributions read the one version file at the repository root.
[tool.hatch.version]
path = "../../VERSION"
pattern = "(?P<version>\\S+)"

# `mt5connector` is a namespace package shared with mt5-connector-client: it has no __init__.py.
# `mt5connector/server/wire` links to the client's wire vocabulary, so this wheel carries a copy.
[tool.hatch.build.targets.wheel]
packages = ["mt5connector"]
